<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar - Cabezones Ingenieros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d1b2a, #1b263b);
        font-family: 'Poppins', sans-serif;
      }
      .login-card {
        width: min(360px, 92vw);
        padding: 2.5rem;
        border-radius: 16px;
        background-color: rgba(10, 15, 25, 0.9);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        color: #e0e6ed;
      }
      .login-card h1 {
        margin: 0;
        font-size: 1.75rem;
        text-align: center;
      }
      .login-card p {
        margin: 0;
      }
      .login-card label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #9fb3c8;
      }
      .login-card input[type='password'] {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        border: 1px solid #1f3c5d;
        background-color: #0d1b2a;
        color: #e0e6ed;
        font-size: 1rem;
      }
      .login-card button {
        margin-top: 0.5rem;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        background: linear-gradient(135deg, #3a86ff, #60c657);
        color: #0b1323;
      }
      .login-card button:hover {
        filter: brightness(1.05);
      }
      .login-error {
        padding: 0.75rem 1rem;
        border-radius: 10px;
        background-color: rgba(220, 53, 69, 0.12);
        color: #ff8080;
        font-size: 0.95rem;
      }
      .login-hint {
        font-size: 0.85rem;
        color: #8296ac;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1>Ingresar</h1>
      <p class="login-hint">Esta pagina requiere la contrasena compartida.</p>
      {% if error %}
        <p class="login-error">Contrasena incorrecta. Intenta nuevamente.</p>
      {% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
